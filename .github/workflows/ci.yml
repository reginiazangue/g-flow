name: CI - G-Flow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gflow

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest-cov

      - name: Verifier le style du code (lint)
        run: flake8 . --max-line-length=120 --exclude=migrations --extend-ignore=E501,F401
        continue-on-error: true

      - name: Verifier la securite du code
        run: bandit -r . -x ./migrations,./tests -ll
        continue-on-error: true

      - name: Lancer les migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SECRET_KEY: cle-temporaire-pour-les-tests
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Verifier la configuration Django
        run: python manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: cle-temporaire-pour-les-tests
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        continue-on-error: true

      - name: Lancer les tests avec couverture
        run: pytest --cov=. --cov-report=term-missing
        env:
          DJANGO_SECRET_KEY: cle-temporaire-pour-les-tests
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1