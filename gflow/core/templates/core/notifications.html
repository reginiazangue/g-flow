{% extends 'core/base.html' %}
{% load i18n %}
{% block content %}
<div class="container py-4" style="max-width:780px">
  {% include 'core/_back.html' %}
  <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="mb-0">{% trans "Notifications" %}</h1>
    <form method="post" action="{% url 'notifications_mark_all_read' %}">{% csrf_token %}<button class="btn btn-ghost btn-sm"><i class="bi bi-check2-all"></i> {% trans "Tout marquer comme lu" %}</button></form>
  </div>
  <div class="gf-card p-0"><div class="list-group list-group-flush">
    {% for n in notifs %}<a href="{{ n.url|default:'#' }}" class="list-group-item bg-transparent {% if not n.is_read %}border-start border-4 border-primary{% endif %}">
      <div class="d-flex justify-content-between"><strong>{{ n.title }}</strong><span class="small text-muted-2">{{ n.created_at|timesince }}</span></div>
      <div class="small text-muted-2">{{ n.body }}</div>
    </a>{% empty %}<div class="gf-empty"><i class="bi bi-bell gf-empty-icon"></i><p>{% trans "Aucune notification." %}</p></div>{% endfor %}
  </div></div>
</div>
{% endblock %}
