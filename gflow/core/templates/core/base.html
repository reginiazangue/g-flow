<!DOCTYPE html>
<html lang="fr" data-theme="{{ current_theme|default:'light' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>{% block title %}G-Flow — Gestion de projets étudiants{% endblock %}</title>
<meta name="description" content="G-Flow : plateforme moderne de gestion de projets étudiants pour enseignants, étudiants et administrateurs.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
{% load static i18n %}
<link href="{% static 'core/css/gflow.css' %}" rel="stylesheet">
{% block extra_head %}{% endblock %}
</head>
<body>
{% include 'core/_navbar.html' %}

{% if messages %}
<div class="container mt-3">
  {% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show" role="alert">
    {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>{% endfor %}
</div>
{% endif %}

<main>{% block content %}{% endblock %}</main>

{% include 'core/_footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'core/js/gflow.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
